<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>쪼아 — 잔소리 캐릭터</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="logo">쪼아</h1>
    <button id="notify-toggle" class="notify-btn" type="button">🔔 알림 끄짐</button>
  </header>

  <main>
    <section id="character-area" class="character-area">
      <div id="character-emoji" class="character-emoji">🙂</div>
      <div class="speech-bubble">
        <p id="character-task-name" class="character-task-name"></p>
        <p id="character-message" class="character-message">할 일을 등록하면 내가 챙겨줄게.</p>
      </div>
      <div id="character-actions" class="character-actions" hidden>
        <button id="btn-start" class="action-btn start" type="button">지금 시작</button>
        <button id="btn-snooze" class="action-btn snooze" type="button">30분 뒤</button>
        <button id="btn-complete" class="action-btn complete" type="button">완료</button>
      </div>
    </section>

    <section class="task-section">
      <h2 class="section-title">해야 할 일</h2>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty-message" hidden>등록된 할 일이 없어. 아래에서 추가해봐.</p>

      <details id="completed-details" class="completed-details" hidden>
        <summary>완료한 일 (<span id="completed-count">0</span>)</summary>
        <ul id="completed-list" class="task-list completed-list"></ul>
      </details>
    </section>

    <section class="add-task-section">
      <button id="toggle-form-btn" class="toggle-form-btn" type="button">+ 할 일 추가</button>
      <form id="task-form" class="task-form" hidden>
        <label>
          제목
          <input id="input-title" type="text" placeholder="예: C++ 과제" required />
        </label>
        <label>
          마감
          <input id="input-deadline" type="datetime-local" required />
        </label>
        <label>
          예상 소요시간 (시간)
          <input id="input-estimated" type="number" min="0.1" step="0.1" placeholder="예: 3" required />
        </label>
        <div class="form-actions">
          <button type="submit" class="submit-btn">등록</button>
          <button type="button" id="cancel-form-btn" class="cancel-btn">취소</button>
        </div>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
